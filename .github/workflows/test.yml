name: api-test

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p123456" 
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
            pip install -r requirements.txt
            
      - name: Init database
        run: |
          python -c "
          import pymysql
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='123456', database='test')
          cur = conn.cursor()
          cur.execute('CREATE TABLE user (id INT AUTO_INCREMENT PRIMARY KEY, username VARCHAR(50), age INT, status TINYINT)')
          cur.execute(\"INSERT INTO user (username, age, status) VALUES ('test_user', 20, 1)\")
          conn.commit()
          cur.close(); conn.close()
          "

      - name: Run pytest
        run: |
            pytest